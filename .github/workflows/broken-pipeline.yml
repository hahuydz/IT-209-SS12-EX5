name: Fixed Pipeline CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  fix-pipeline:
    name: Chẩn đoán và Sửa lỗi Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Khắc phục Lỗi 1 - Cấp quyền thực thi Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          echo "plugins { id 'java' }" > build.gradle
          echo "rootProject.name = 'fixed-demo'" > settings.gradle
          touch gradlew
          chmod +x gradlew
          touch gradle/wrapper/gradle-wrapper.properties

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Khắc phục Lỗi 2 - Đăng nhập Container Registry sử dụng đúng Secret
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Khắc phục Lỗi 3 - Cấu hình đúng Build Context cho Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/${{ github.actor }}/fixed-app:latest
